name: API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mdawiki_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -ptest" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom, gd, intl
      - run: find config src public tests bin scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: php tests/features.php
      - run: php tests/mail.php
      - run: php tests/features.php
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mdawiki_test;charset=latin1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php tests/mailer.php
      - run: php tests/mail.php
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mdawiki_test;charset=latin1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: legacy/composer.lock
          retention-days: 3
      - run: python3 tests/integration_http.py
      - run: php tests/normalized.php
      - name: Validate MySQL export against the D1 schema
        env:
          MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=normalized_test;charset=utf8mb4
          MYSQL_USER: root
          MYSQL_PASSWORD: test
        run: php scripts/export-mysql.php "$RUNNER_TEMP/mdawiki-data.sql"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run
